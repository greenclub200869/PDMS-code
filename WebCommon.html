<script>
const PDMS = (() => {
  const S={
    boot:null,route:'dashboard',rpcTimeout:25000,
    personnel:[],aliases:[],scopes:[],personMode:'CREATE',originalEmpId:'',personSub:'people',leavePreview:null,leaveActiveView:{page:1,pageSize:100,search:'',leaveType:'',department:'',dateFrom:'',dateTo:'',sort:'DATE_DESC'},personBulkPreview:null,positionMasters:[],departmentMasters:[],settings:{},settingsSub:'org',settingsLoaded:{},warningLeaveTypes:[],busyCount:0,routeLoaded:{},routeLoadedAt:{},aliasView:[],attendancePayload:null,attendancePreview:null,attendanceBootstrap:null,attendanceA021:null,attendanceA021Filtered:[],attendanceA021View:'matrix',attendanceA021DailyPage:1,reviewBootstrap:null,reviewPage:1,reviewCurrent:null,reviewDataset:null,reviewDatasetMonth:'',reviewFiltered:[],finalEventBootstrap:null,finalEventPage:1,finalEventLast:null,finalEventDataset:null,finalEventDatasetMonth:'',finalEventDatasetCache:{},finalEventFiltered:[],finalEventVisibleRows:[],finalEventSelected:{},statsBootstrap:null,statsDataset:null,statsDatasetMonth:'',statsFiltered:[],statsPage:1,statsSelectedEmp:'',warningBootstrap:null,warningDataset:null,warningDatasetMonth:'',warningFiltered:[],warningLoaded:false,aliasLoaded:false,scopeLoaded:false,qaLoaded:false,routeGeneration:0,readFlights:{},taskFlights:{},systemHealthRun:0,documentTestRunning:false,documentIssueRunning:false,documentIssuePrepared:null
  };

  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function toast(t){
    const el=document.getElementById('toast');
    const msg=document.getElementById('toastMessage');
    if(msg) msg.textContent=String(t??'');
    else el.textContent=String(t??'');
    el.style.display='block';
  }
  function closeToast(){
    const el=document.getElementById('toast');
    if(el) el.style.display='none';
  }
  function busyLabel(method){const m=String(method||'');if(/Save|Commit|SetActive|Activate|Merge/.test(m))return 'กำลังบันทึกและตรวจสอบข้อมูล…';if(/Preview|Qa|Health/.test(m))return 'กำลังตรวจสอบข้อมูล…';return 'กำลังโหลดข้อมูล…';}
  function setBusy(on,label){const ov=document.getElementById('busyOverlay'),txt=document.getElementById('busyText');if(on)S.busyCount++;else S.busyCount=Math.max(0,S.busyCount-1);if(txt&&label)txt.textContent=label;if(ov)ov.classList.toggle('show',S.busyCount>0);if(document.body)document.body.classList.toggle('loading',S.busyCount>0);}
  function resetBusy(){S.busyCount=0;const ov=document.getElementById('busyOverlay');if(ov)ov.classList.remove('show');if(document.body)document.body.classList.remove('loading');}
  function rpc(method,args=[],timeout){
    setBusy(true,busyLabel(method));
    return new Promise((resolve,reject)=>{let done=false;const finish=()=>setBusy(false);const fail=(e)=>{if(done)return;done=true;clearTimeout(timer);finish();reject(new Error(e&&e.message?e.message:String(e)))};const timer=setTimeout(()=>fail(new Error('ระบบใช้เวลาประมวลผลนานกว่าปกติ กรุณาลองโหลดใหม่ หากยังเกิดซ้ำให้เปิด “ตรวจและกู้คืนงานค้าง”')),timeout||S.rpcTimeout);try{let r=google.script.run.withSuccessHandler(v=>{if(done)return;done=true;clearTimeout(timer);finish();resolve(v)}).withFailureHandler(fail);if(!r||typeof r[method]!=='function')throw new Error('ไม่พบ Web endpoint: '+method);r[method].apply(r,args);}catch(e){fail(e);}});
  }
  function rpcPassive(method,args=[],timeout){
    return new Promise((resolve,reject)=>{let done=false;const fail=(e)=>{if(done)return;done=true;clearTimeout(timer);reject(new Error(e&&e.message?e.message:String(e)))};const timer=setTimeout(()=>fail(new Error('โหลดข้อมูลสรุปหน้าแรกใช้เวลานานกว่าปกติ คุณยังสามารถเปิดเมนูอื่นได้ และลองรีเฟรชหน้าแรกภายหลัง')),timeout||15000);try{let r=google.script.run.withSuccessHandler(v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)}).withFailureHandler(fail);if(!r||typeof r[method]!=='function')throw new Error('ไม่พบ Web endpoint: '+method);r[method].apply(r,args);}catch(e){fail(e);}});
  }
  function rpcRead(method,args=[],timeout,options={}){
    const key=String(options.key||method+'|'+JSON.stringify(args||[])),routeToken=options.routeGuard===false?null:S.routeGeneration;
    let base=S.readFlights[key];
    if(!base){
      base=new Promise((resolve,reject)=>{let done=false;const fail=(e)=>{if(done)return;done=true;clearTimeout(timer);reject(new Error(e&&e.message?e.message:String(e)))};const timer=setTimeout(()=>fail(new Error('โหลดข้อมูลใช้เวลานานกว่าปกติ กรุณาลองใหม่อีกครั้ง')),timeout||30000);try{let r=google.script.run.withSuccessHandler(v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)}).withFailureHandler(fail);if(!r||typeof r[method]!=='function')throw new Error('ไม่พบ Web endpoint: '+method);r[method].apply(r,args);}catch(e){fail(e);}});
      S.readFlights[key]=base;
      base.then(()=>{if(S.readFlights[key]===base)delete S.readFlights[key];},()=>{if(S.readFlights[key]===base)delete S.readFlights[key];});
    }
    return base.then(v=>{if(routeToken!==null&&routeToken!==S.routeGeneration){const e=new Error('คำขอนี้เป็นของหน้าก่อนหน้า');e.pdmsStale=true;throw e;}return v;});
  }
  function rpcTask(method,args=[],timeout,options={}){
    const key=String(options.key||method+'|'+JSON.stringify(args||[])),routeToken=options.routeGuard===false?null:S.routeGeneration;
    let base=S.taskFlights[key];
    if(!base){
      base=new Promise((resolve,reject)=>{let done=false;const fail=(e)=>{if(done)return;done=true;clearTimeout(timer);reject(new Error(e&&e.message?e.message:String(e)))};const timer=setTimeout(()=>fail(new Error('งานเอกสารใช้เวลานานกว่าปกติ ระบบจะไม่เริ่มชุดถัดไปอัตโนมัติ')),timeout||120000);try{let r=google.script.run.withSuccessHandler(v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)}).withFailureHandler(fail);if(!r||typeof r[method]!=='function')throw new Error('ไม่พบ Web endpoint: '+method);r[method].apply(r,args);}catch(e){fail(e);}});
      S.taskFlights[key]=base;
      base.then(()=>{if(S.taskFlights[key]===base)delete S.taskFlights[key];},()=>{if(S.taskFlights[key]===base)delete S.taskFlights[key];});
    }
    return base.then(v=>{if(routeToken!==null&&routeToken!==S.routeGeneration){const e=new Error('คำขอนี้เป็นของหน้าก่อนหน้า');e.pdmsStale=true;throw e;}return v;});
  }
  async function documentTaskRetry_(method,args,timeout,key){try{return await rpcTask(method,args,timeout,{key});}catch(e){if(ignoreStale_(e))throw e;return await rpcTask(method,args,timeout,{key:key+'|retry'});}}
  function ignoreStale_(e){return !!(e&&e.pdmsStale);}
  function periodText(period){
    if(!period||!period.months||!period.months.length)return 'รอบ 6 เดือน: ยังไม่ได้ตั้งค่า';
    return 'รอบ 6 เดือน: '+period.months.map(x=>x.label).join(' • ');
  }
  function renderNav(){
    nav.innerHTML=(S.boot.routes||[]).map(r=>`<button class="nav-btn ${r.enabled?'':'disabled'}" data-route="${esc(r.id)}" ${r.enabled?`onclick="PDMS.go('${esc(r.id)}')"`:''}>${esc(r.label)}${r.enabled?'':' — เร็ว ๆ นี้'}</button>`).join('');
  }
  function markNav(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.route===S.route))}
  function routeFresh(route){const at=Number(S.routeLoadedAt[route]||0),ttl=route==='system'?20000:route==='dashboard'?30000:(route==='personnel'||route==='attendance'||route==='review'||route==='finalevents'||route==='statistics'||route==='documents'?180000:120000);return !!S.routeLoaded[route]&&(Date.now()-at)<ttl;}
  function invalidateDerivedClientCaches_(){S.attendanceA021=null;S.attendanceA021Filtered=[];S.reviewCurrent=null;S.reviewDataset=null;S.reviewDatasetMonth='';S.reviewFiltered=[];S.finalEventDataset=null;S.finalEventDatasetMonth='';S.finalEventDatasetCache={};S.finalEventLast=null;['attendance','review','finalevents'].forEach(r=>{S.routeLoaded[r]=false;S.routeLoadedAt[r]=0;});}
  function invalidatePersonnelClientCaches_(){S.aliasLoaded=false;S.scopeLoaded=false;S.qaLoaded=false;S.routeLoaded.personnel=false;S.routeLoadedAt.personnel=0;S.statsDataset=null;S.statsDatasetMonth='';S.statsFiltered=[];S.routeLoaded.statistics=false;S.routeLoadedAt.statistics=0;invalidateDerivedClientCaches_();}
  async function loadRoute(route,force){
    if(!force&&routeFresh(route))return;
    if(route==='dashboard')await loadDashboard(!!force);
    else if(route==='personnel')await loadPersonnelBootstrap(!!force);
    else if(route==='leave')await loadLeaveBootstrap(!!force);
    else if(route==='attendance')await loadAttendanceBootstrap(!!force);
    else if(route==='review')await loadReviewBootstrap(!!force);
    else if(route==='finalevents')await loadFinalEventBootstrap(!!force);
    else if(route==='statistics')await loadStatisticsBootstrap(!!force);
    else if(route==='documents')await loadWarningCandidateBootstrap(!!force);
    else if(route==='settings')await loadSettings(undefined,!!force);
    else if(route==='system')prepareSystemPage_();
    S.routeLoaded[route]=true;S.routeLoadedAt[route]=Date.now();
  }
  function go(route){
    const allowed=(S.boot.routes||[]).find(r=>r.id===route&&r.enabled);
    if(!allowed){toast('โมดูลนี้ยังไม่เปิดใช้งาน');return}
    if(S.route!==route)S.routeGeneration++;
    S.route=route;
    document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===route));
    pageTitle.textContent=allowed.label;markNav();
    if(history&&history.replaceState)history.replaceState(null,'','#'+route);
    loadRoute(route,false).catch(e=>toast(e.message));
    if(window.innerWidth<760)sidebar.classList.remove('open');
  }
  function renderDashboard(b){
    const light=!!(b.health&&b.health.checked===false);
    kpiHealth.textContent=light?'พร้อม':'ตรวจ';
    kpiHealth.style.color='var(--ok)';
    kpiHealthNote.textContent=light?'พร้อมใช้งานเบื้องต้น • ตรวจสุขภาพเต็มรูปแบบได้ที่เมนูระบบ':'พร้อมใช้งาน';
    kpiPeople.textContent=b.personnel.count;kpiAliases.textContent=b.personnel.aliases;kpiJobs.textContent=b.jobs.open;
    periodMonths.innerHTML=b.period.months.length?b.period.months.map(x=>`<span class="badge ok" style="margin:3px">${esc(x.label)}</span>`).join(''):'<span class="badge warn">ยังไม่ได้ตั้งรอบ 6 เดือน</span>';
    const issues=[];if(!b.period.months.length)issues.push('ยังไม่ได้ตั้งรอบการทำงาน 6 เดือน');if(b.jobs.open)issues.push('มีงานเปิดอยู่ '+b.jobs.open+' งาน');
    dashboardIssues.innerHTML=issues.length?'<ul class="list">'+issues.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="badge ok">ไม่พบรายการที่ต้องติดตามจากการตรวจแบบเบา</span>';
    moduleCards.innerHTML=(b.routes||[]).map(r=>`<span class="badge ${r.enabled?'ok':'warn'}" style="margin:3px">${esc(r.label)} — ${r.enabled?'เปิดแล้ว':'รอ Build'}</span>`).join('');
    healthDot.className='dot ok';sidebarStatus.textContent='ระบบพร้อมใช้งาน';periodTextEl().textContent=periodText(b.period);
  }
  function periodTextEl(){return document.getElementById('periodText')}

  async function boot(){
    resetBusy();
    try{S.boot=await rpc('pdmscWebShellBootstrap');buildText.textContent=(S.boot.app.webBuild||'')+' | '+S.boot.app.version;renderNav();let r=(location.hash||'').replace('#','')||window.PDMS_INITIAL_ROUTE||'dashboard';if(!(S.boot.routes||[]).some(x=>x.id===r&&x.enabled))r='dashboard';go(r);}catch(e){sidebarStatus.textContent='เชื่อมต่อไม่สำเร็จ';toast(e.message);}
  }
  async function loadDashboard(force){try{const b=await rpcPassive('pdmscWebDashboardRefresh',[!!force],15000);renderDashboard(b);}catch(e){toast(e.message)}}
  async function refreshCurrent(){try{S.routeLoaded[S.route]=false;await loadRoute(S.route,true);}catch(e){toast(e.message)}}


  // ---------- Attendance Review Center A02.2 / V0.2 Fast Review ----------
  async function loadReviewBootstrap(force){
    try{
      const b=await rpc('pdmscWebReviewBootstrap',[!!force],20000);S.reviewBootstrap=b||{};renderReviewBootstrap_(b||{});
      const month=(document.getElementById('reviewMonth')||{}).value||'';
      if(S.reviewDataset&&S.reviewDatasetMonth===month)reviewApplyLocal_(1);else reviewResetView_('ยังไม่ได้โหลดรายการ — กด “โหลด/รีเฟรชรายการที่ต้องตรวจ” เมื่อต้องการตรวจ');
    }catch(e){toast(e.message)}
  }
  function renderReviewBootstrap_(b){const m=document.getElementById('reviewMonth'),old=m?m.value:'';if(m){m.innerHTML=(b.months||[]).map(x=>`<option value="${esc(x.key)}">${esc(x.label)}</option>`).join('');if(old&&(b.months||[]).some(x=>x.key===old))m.value=old;}}
  function reviewResetView_(msg){['reviewKpiTotal','reviewKpiPending','reviewKpiDecided','reviewKpiStale'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='-';});const body=document.getElementById('reviewBody'),meta=document.getElementById('reviewMeta'),pager=document.getElementById('reviewPager');if(body)body.innerHTML='<tr><td colspan="10" class="empty">'+esc(msg||'ยังไม่ได้โหลด')+'</td></tr>';if(meta)meta.textContent=msg||'ยังไม่ได้โหลด';if(pager)pager.innerHTML='';}
  async function loadReviewDataset(force){
    const month=(document.getElementById('reviewMonth')||{}).value||'';if(!month){toast('กรุณาเลือกเดือน');return;}
    if(!force&&S.reviewDataset&&S.reviewDatasetMonth===month){reviewApplyLocal_(1);return;}
    try{const r=await rpc('pdmscWebReviewDataset',[month,!!force],120000);S.reviewDataset=r||{rows:[]};S.reviewDatasetMonth=month;S.reviewPage=1;reviewFillFilters_(r||{});reviewApplyLocal_(1);S.routeLoaded.review=true;S.routeLoadedAt.review=Date.now();}catch(e){toast(e.message)}
  }
  function reviewFillFilters_(r){const dep=document.getElementById('reviewDepartment'),code=document.getElementById('reviewCode'),oldDep=dep?dep.value:'',oldCode=code?code.value:'';if(dep){dep.innerHTML='<option value="">ทั้งหมด</option>'+((r.filters||{}).departments||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(oldDep)dep.value=oldDep;}if(code){code.innerHTML='<option value="">ทั้งหมด</option>'+((r.filters||{}).reviewCodes||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(oldCode)code.value=oldCode;}}
  function reviewPayloadLocal_(){return{search:(document.getElementById('reviewSearch')||{}).value||'',department:(document.getElementById('reviewDepartment')||{}).value||'',reviewCode:(document.getElementById('reviewCode')||{}).value||'',status:(document.getElementById('reviewStatus')||{}).value||'',decision:(document.getElementById('reviewDecision')||{}).value||'',dateKey:((document.getElementById('reviewDate')||{}).value||'').replace(/-/g,''),sort:(document.getElementById('reviewSort')||{}).value||'DATE_NAME',pageSize:Number((document.getElementById('reviewPageSize')||{}).value)||50};}
  function reviewApplyLocal_(page){if(!S.reviewDataset||S.reviewDatasetMonth!==((document.getElementById('reviewMonth')||{}).value||'')){reviewResetView_('ยังไม่ได้โหลดรายการของเดือนนี้');return;}const f=reviewPayloadLocal_(),q=String(f.search||'').trim().toLowerCase(),cmp=(a,b)=>String(a||'').localeCompare(String(b||''),'th');let rows=(S.reviewDataset.rows||[]).filter(x=>(!q||(String(x.empId)+' '+String(x.name||'')+' '+String(x.sourceName||'')).toLowerCase().includes(q))&&(!f.department||x.department===f.department)&&(!f.reviewCode||x.reviewCode===f.reviewCode)&&(!f.status||x.decisionStatus===f.status)&&(!f.decision||x.decision===f.decision)&&(!f.dateKey||x.dateKey===f.dateKey));rows.sort((a,b)=>f.sort==='NAME_DATE'?cmp(a.name,b.name)||cmp(a.dateKey,b.dateKey):f.sort==='DEPARTMENT_NAME'?cmp(a.department,b.department)||cmp(a.name,b.name)||cmp(a.dateKey,b.dateKey):f.sort==='TYPE_DATE'?cmp(a.reviewCode,b.reviewCode)||cmp(a.dateKey,b.dateKey)||cmp(a.name,b.name):cmp(a.dateKey,b.dateKey)||cmp(a.name,b.name));S.reviewFiltered=rows;const pages=Math.max(1,Math.ceil(rows.length/f.pageSize));S.reviewPage=Math.max(1,Math.min(pages,Number(page)||1));const start=(S.reviewPage-1)*f.pageSize;renderReviewList_({summary:S.reviewDataset.summary||{},page:S.reviewPage,pageSize:f.pageSize,pages,total:rows.length,rows:rows.slice(start,start+f.pageSize),serverMs:S.reviewDataset.serverMs||0,local:true});}
  async function loadReviewList(page,force){if(force)return loadReviewDataset(true);reviewApplyLocal_(page||1);}
  function renderReviewList_(r){const sm=r.summary||{},set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};set('reviewKpiTotal',sm.total??0);set('reviewKpiPending',sm.pending??0);set('reviewKpiDecided',sm.decided??0);set('reviewKpiStale',sm.stale??0);const meta=document.getElementById('reviewMeta'),body=document.getElementById('reviewBody'),pager=document.getElementById('reviewPager');if(meta)meta.textContent=`พบตามตัวกรอง ${r.total||0} รายการ | กรองใน หน้าเว็บ | โหลดครั้งแรก ${(r.serverMs||0)} ms`;let prevEmp='';if(body)body.innerHTML=(r.rows||[]).length?(r.rows||[]).map(x=>{const cls=pdmsRowGroupClass_(prevEmp,x.empId);prevEmp=x.empId;return `<tr class="${cls}"><td>${esc(x.date)}</td><td>${esc(x.empId)}</td><td>${esc(x.name)}</td><td>${esc(x.department||'-')}</td><td><span class="badge warn">${esc(x.reviewCode||x.resultType)}</span></td><td>${esc(attendanceA021DisplayRaw_(x.mainRaw)||'-')} / ${esc(attendanceA021DisplayRaw_(x.secondaryRaw)||'-')}</td><td class="review-reason">${esc(x.reason||'-')}</td><td><span class="badge ${reviewBadge_(x.decisionStatus)}">${esc(x.decisionStatusLabel)}</span></td><td>${esc(x.decisionLabel||'รอตรวจ')}</td><td><button class="btn secondary" onclick="PDMS.openReviewDetail('${esc(x.eventIdentity)}')">เปิด</button></td></tr>`}).join(''):'<tr><td colspan="10" class="empty">ไม่พบรายการตามตัวกรอง</td></tr>';if(pager){const prev=Math.max(1,r.page-1),next=Math.min(r.pages,r.page+1);pager.innerHTML=`<button class="btn secondary" ${r.page<=1?'disabled':''} onclick="PDMS.loadReviewList(${prev},false)">ก่อนหน้า</button><span class="pager-label">หน้า ${r.page} / ${r.pages}</span><button class="btn secondary" ${r.page>=r.pages?'disabled':''} onclick="PDMS.loadReviewList(${next},false)">ถัดไป</button>`;}}
  function clearReviewFilters(){['reviewSearch','reviewDate'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});['reviewDepartment','reviewCode','reviewStatus','reviewDecision'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});const so=document.getElementById('reviewSort'),ps=document.getElementById('reviewPageSize');if(so)so.value='DATE_NAME';if(ps)ps.value='50';reviewApplyLocal_(1);}
  async function openReviewDetail(eventIdentity){
    try{const r=await rpc('pdmscWebReviewDetail',[eventIdentity,false],25000);S.reviewCurrent=r.item;renderReviewDetail_(r);const m=document.getElementById('reviewDetailModal');if(m)m.style.display='flex';}catch(e){toast(e.message)}
  }

  function attendanceNormalizeColor_(value){
    let c=String(value||'').trim().toLowerCase();if(!c||c==='transparent'||c==='none'||c==='white'||c==='rgba(0, 0, 0, 0)')return'#ffffff';
    const named={lime:'#00ff00',green:'#008000',blue:'#0000ff',aqua:'#00ffff',cyan:'#00ffff',red:'#ff0000',yellow:'#ffff00',pink:'#ffc0cb',lightblue:'#add8e6',skyblue:'#87ceeb',black:'#000000',white:'#ffffff'};if(named[c])return named[c];
    const rgb=c.match(/rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)(?:\s*,\s*([0-9.]+))?/i);if(rgb){if(rgb[4]!==undefined&&Number(rgb[4])===0)return'#ffffff';return'#'+[rgb[1],rgb[2],rgb[3]].map(n=>('0'+Number(n).toString(16)).slice(-2)).join('');}
    const h=c.match(/#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})\b/i);if(h){let x=h[1];if(x.length===3)x=x.split('').map(z=>z+z).join('');if(x.length===8&&x.slice(6)==='00')return'#ffffff';return'#'+x.slice(0,6).toLowerCase();}
    return c;
  }
  function attendanceCssColorMap_(host){
    const map={};Array.from(host.querySelectorAll('style')).forEach(st=>{const css=st.textContent||'';let m;const re=/([^{}]+)\{([^{}]*)\}/g;while((m=re.exec(css))){const body=m[2]||'',bm=body.match(/(?:background-color|background)\s*:\s*([^;!}]+)/i);if(!bm)continue;const color=attendanceNormalizeColor_(bm[1]);String(m[1]||'').split(',').forEach(sel=>{const classes=sel.match(/\.([A-Za-z0-9_-]+)/g)||[];classes.forEach(k=>{map[k.slice(1)]=color;});});}});return map;
  }
  function attendanceDescendantColors_(cell,classColors){
    const out=[];if(!cell||!cell.querySelectorAll)return out;
    Array.from(cell.querySelectorAll('*')).slice(0,80).forEach(n=>{
      if(n.style){if(n.style.backgroundColor)out.push(n.style.backgroundColor);if(n.style.background)out.push(n.style.background);}
      if(n.getAttribute){const a=n.getAttribute('style')||'',m=a.match(/(?:background-color|background)\s*:\s*([^;!}]+)/i);if(m)out.push(m[1]);const b=n.getAttribute('bgcolor');if(b)out.push(b);}
      if(n.classList&&classColors)Array.from(n.classList).forEach(k=>{if(classColors[k])out.push(classColors[k]);});
      if(window.getComputedStyle){try{const cs=window.getComputedStyle(n);if(cs.backgroundColor)out.push(cs.backgroundColor);}catch(_e){}}
    });
    return out;
  }
  function attendanceColor_(cell,classColors){
    const candidates=[],push=v=>{if(v)candidates.push(v)};
    if(cell&&cell.getAttribute){
      const raw=cell.getAttribute('style')||'',m=raw.match(/(?:background-color|background)\s*:\s*([^;!}]+)/i);if(m)push(m[1]);
      push(cell.getAttribute('bgcolor'));push(cell.getAttribute('background'));
    }
    if(cell&&cell.style){push(cell.style.backgroundColor);push(cell.style.background);}
    if(cell&&cell.classList&&classColors)Array.from(cell.classList).forEach(k=>push(classColors[k]));
    if(window.getComputedStyle&&cell){try{const cs=window.getComputedStyle(cell);push(cs.backgroundColor);push(cs.background);}catch(_e){}}
    attendanceDescendantColors_(cell,classColors).forEach(push);
    let n=cell&&cell.parentElement;for(let depth=0;n&&depth<3;depth++,n=n.parentElement){
      if(n.classList&&classColors)Array.from(n.classList).forEach(k=>push(classColors[k]));
      if(n.getAttribute){const raw=n.getAttribute('style')||'',m=raw.match(/(?:background-color|background)\s*:\s*([^;!}]+)/i);if(m)push(m[1]);}
      if(window.getComputedStyle){try{push(window.getComputedStyle(n).backgroundColor);}catch(_e){}}
      if(n.tagName==='TABLE')break;
    }
    for(const c of candidates){const x=attendanceNormalizeColor_(c);if(x&&x!=='#ffffff'&&x!=='transparent')return x;}
    return'#ffffff';
  }
  function attendanceHtmlTable_(html){
    if(!html)return null;const host=document.createElement('div');host.style.cssText='position:fixed;left:-100000px;top:-100000px;visibility:hidden;pointer-events:none';host.innerHTML=html;host.querySelectorAll('script').forEach(x=>x.remove());document.body.appendChild(host);const table=host.querySelector('table');if(!table){host.remove();return null;}const classColors=attendanceCssColorMap_(host);
    const trs=Array.from(table.querySelectorAll('tr')),grid=[],bgs=[],anchors=[],merges=[];
    trs.forEach((tr,r)=>{if(!grid[r])grid[r]=[];if(!bgs[r])bgs[r]=[];if(!anchors[r])anchors[r]=[];let c=0;Array.from(tr.children).filter(x=>/^(TD|TH)$/.test(x.tagName)).forEach(td=>{while(grid[r][c]!==undefined)c++;const rs=Math.max(1,Number(td.getAttribute('rowspan')||1)),cs=Math.max(1,Number(td.getAttribute('colspan')||1)),txt=(td.innerText||td.textContent||'').replace(/\u00a0/g,' ').trim(),bg=attendanceColor_(td,classColors);if(rs>1||cs>1)merges.push({row:r,col:c,rowSpan:rs,colSpan:cs});for(let rr=0;rr<rs;rr++){while(grid.length<=r+rr)grid.push([]);while(bgs.length<=r+rr)bgs.push([]);while(anchors.length<=r+rr)anchors.push([]);for(let cc=0;cc<cs;cc++){const ar=r+rr,ac=c+cc;grid[ar][ac]=(rr===0&&cc===0)?txt:'';bgs[ar][ac]=bg;anchors[ar][ac]=(rr===0&&cc===0);}}c+=cs;});});

  async function loadJobs(){try{const rows=await rpcRead('pdmscWebSystemJobs',[],30000,{key:'system-jobs'});jobsBox.innerHTML=rows.length?'<div class="table-wrap"><table><thead><tr><th>รหัสงาน</th><th>ประเภทงาน</th><th>เดือน</th><th>สถานะ</th><th>ขั้นตอน</th><th>อัปเดตล่าสุด</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${esc(x.jobId)}</td><td>${esc(x.jobType)}</td><td>${esc(x.monthKey)}</td><td>${esc(x.status)}</td><td>${esc(x.stage)}</td><td>${esc(x.updatedAt)}</td></tr>`).join('')+'</tbody></table></div>':'<span class="badge ok">ไม่มีงานค้าง</span>'}catch(e){if(!ignoreStale_(e))toast(e.message)}}
  async function loadAudit(){try{const rows=await rpcRead('pdmscWebAuditRecent',[30],30000,{key:'system-audit-30'});auditBody.innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.timestamp)}</td><td>${esc(x.action)}</td><td>${esc(x.status)}</td><td>${esc(x.actor)}</td><td class="mono">${esc(x.details)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ยังไม่มีประวัติ</td></tr>'}catch(e){if(!ignoreStale_(e))toast(e.message)}}
  async function refreshSystem(force){prepareSystemPage_();}
  function toggleSidebar(){sidebar.classList.toggle('open')}

  function renderDocumentSettings_(b){const d=b.data||{},v=d.settings||{},style=d.style||{},box=document.getElementById('documentSettingsSummary');if(box)box.innerHTML=`ชื่อโรงเรียน: <b>${esc(v.SCHOOL_NAME||'ยังไม่ตั้ง')}</b><br>ผู้อำนวยการ: <b>${esc(v.DIRECTOR_NAME||'ยังไม่ตั้ง')}</b><br>A4 Output: <b>210 × 297 mm</b>`;const t=document.getElementById('docTemplateInputs');if(t)t.innerHTML=(d.templates||[]).map(x=>`<label>${esc(x.label)}<input class="input full doc-template-input" data-setting="${esc(x.setting)}" value="${esc(x.value||x.fileId||'')}"><span class="helper">${esc(x.code)}</span></label>`).join('');if(document.getElementById('docStyleName'))docStyleName.value=style.profileName||'ค่าเริ่มต้น';if(document.getElementById('docStyleFont'))docStyleFont.value=style.fontFamily||'TH SarabunPSK';if(document.getElementById('docStyleSize'))docStyleSize.value=style.fontSize||16;if(document.getElementById('docLineSpacing'))docLineSpacing.value=style.lineSpacing||0.9;if(document.getElementById('docTabPoints'))docTabPoints.value=style.tabPoints||36;if(document.getElementById('docStyleRevision'))docStyleRevision.value=style.revision||'1';if(document.getElementById('docOutputFolder'))docOutputFolder.value=v.DOC_OUTPUT_FOLDER_ID||'';}
  async function saveDocumentSettings(){const payload={DOC_STYLE_PROFILE_NAME:docStyleName.value,DOC_STYLE_FONT_FAMILY:docStyleFont.value,DOC_STYLE_FONT_SIZE:docStyleSize.value,DOC_STYLE_LINE_SPACING:docLineSpacing.value,DOC_STYLE_TAB_POINTS:docTabPoints.value,DOC_STYLE_REVISION:docStyleRevision.value,DOC_OUTPUT_FOLDER_ID:docOutputFolder.value};document.querySelectorAll('.doc-template-input').forEach(e=>payload[e.dataset.setting]=e.value);try{await rpc('pdmscWebDocumentSettingsSave',[payload],30000);S.settingsLoaded.document=false;await loadSettings('document',true);toast('บันทึกแม่แบบและ รูปแบบข้อความ แล้ว')}catch(e){toast(e.message)}}
  async function validateDocumentTemplates(){const el=document.getElementById('docTemplateStatus');if(el)el.textContent='กำลังตรวจ...';try{const r=await rpc('pdmscWebDocumentValidateTemplates',[],60000);if(el)el.textContent=(r.ok?'PASS':'ต้องตรวจ')+' • '+(r.items||[]).map(x=>x.label+': '+(x.ok?'พร้อม':x.note)).join(' | ');toast(r.ok?'แม่แบบ 7 รายการพร้อมใช้':'มีแม่แบบต้องตรวจ')}catch(e){if(el)el.textContent=e.message;toast(e.message)}}

async function previewSelectedWarningCover(){const keys=selectedWarningKeys_();if(!keys.length){toast('กรุณาเลือกรายการที่สามารถออกหนังสือได้อย่างน้อย 1 ราย');return;}const month=(document.getElementById('warningMonth')||{}).value||'',box=document.getElementById('warningTestResult');try{if(box)box.innerHTML='<div class="notice neutral"><b>กำลังเตรียมตัวอย่างหนังสือนำ…</b><div class="helper">ใช้รายการที่โหลดไว้ก่อนและไม่บังคับคำนวณเกณฑ์ใหม่ทั้งเดือน</div></div>';const p=await rpcRead('pdmscWebDocumentCoverPreview',[month,keys],60000,{key:'doc-cover-preview|'+month+'|'+keys.join('|')});S.documentPreview={type:'COVER_GROUPS',data:p,keys};if(box)box.innerHTML='';showDocumentPreview_(p,true)}catch(e){if(!ignoreStale_(e)){if(box)box.innerHTML=`<div class="notice warn">${esc(e.message)}</div>`;toast(e.message)}}}
function showDocumentPreview_(p,isCover){const m=document.getElementById('documentPreviewModal'),title=document.getElementById('documentPreviewTitle'),meta=document.getElementById('documentPreviewMeta'),body=document.getElementById('documentPreviewBody'),btn=document.getElementById('documentIssueBtn'),groups=(p&&p.groups)||[];if(title)title.textContent='ตัวอย่างหนังสือนำ';if(meta)meta.textContent=`${Number(p.totalPersons||0)} ราย • ${groups.length} กลุ่มหนังสือนำ`;if(body)body.innerHTML=groups.map((g,i)=>`<div class="notice neutral"><b>${i+1}. หนังสือนำ${g.category==='LEAVE'?'การลา':'การสาย'} • ${g.personCount} ราย</b><pre class="doc-preview-text">${esc((g.lines||[]).join('\n'))}</pre><div class="helper">รอบ ${esc(g.windowKey||'-')} • รูปแบบข้อความ ${(g.previews||[])[0]?.style?.profileName||'-'} • ตัวเลขสถิติอ่านจากระบบคำนวณกลาง</div></div>`).join('');if(btn){btn.style.display='';btn.onclick=()=>issueSelectedWarningPersons();btn.textContent='ตรวจความพร้อมก่อนออกจริง';}if(m)m.style.display='flex';}
async function issueDocumentPreview_(){const x=S.documentPreview;if(!x||!x.data||x.type!=='COVER_GROUPS')return;const groups=x.data.groups||[];if(groups.length!==1){toast('การเลือกคละประเภท/รอบใช้สำหรับตัวอย่างและเอกสารทดลองเท่านั้น การออกจริงให้เลือกทีละกลุ่ม');return;}const g=groups[0],month=(document.getElementById('warningMonth')||{}).value||'';openDocumentIssueConfirm_({type:'COVER',month,keys:x.keys,previewFingerprint:g.previewFingerprint,personCount:g.personCount||0});}
  function closeDocumentPreview(){const m=document.getElementById('documentPreviewModal');if(m)m.style.display='none';S.documentPreview=null;}
  async function loadDocumentHistory(force){try{const r=await rpc('pdmscWebDocumentHistory',[],60000),s=r.summary||{},meta=document.getElementById('documentHistorySummary'),box=document.getElementById('documentHistoryList');if(meta)meta.textContent=`ออกแล้ว ${s.documents||0} รายการ • บุคลากร ${s.persons||0} คน • หนังสือนำ ${s.covers||0} • นำเข้าจากระบบเดิม ${s.legacy||0}`;if(box)box.innerHTML=(r.rows||[]).length?'<div class="table-wrap pdms-sticky-table"><table><thead><tr><th>วันที่ออกหนังสือ</th><th>สร้างในระบบ</th><th>บุคลากร/ประเภท</th><th>เหตุผล</th><th>ช่วงข้อมูล</th><th>ไฟล์</th><th>แหล่งที่มา</th></tr></thead><tbody>'+r.rows.map(x=>`<tr><td>${esc(String(x.issueDate||x.createdAt||'').slice(0,10))}</td><td>${esc(String(x.createdAt||'').replace('T',' ').slice(0,16))}</td><td>${esc(x.fullName||x.documentType||'-')}<div class="muted">${esc(x.empId||x.category||'')}</div></td><td>${esc(x.documentReason||'-')}</td><td>${esc((x.periodStart||'')+' → '+(x.periodEnd||''))}</td><td>${x.fileUrl?`<a href="${esc(x.fileUrl)}" target="_blank">เปิด Google Docs</a>`:'-'}</td><td>${esc(x.source==='LEGACY_IMPORT'?'ข้อมูลเดิมที่นำเข้า':'ระบบปัจจุบัน')}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">ยังไม่มีประวัติการออกหนังสือ</div>';}catch(e){toast(e.message)}}
