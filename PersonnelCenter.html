<!doctype html><html><head><base target="_top"><style>body{font-family:Arial;margin:0;background:#f8f9fa;color:#202124}header,.tabs{background:#fff;padding:10px 14px;border-bottom:1px solid #ddd}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button,button{padding:8px 11px;border:1px solid #ccc;border-radius:7px;background:#fff;cursor:pointer}.tabs .active,.primary{background:#1a73e8!important;color:#fff!important}main{padding:12px}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}input,select{padding:8px;border:1px solid #bbb;border-radius:6px}.status{padding:8px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;margin-bottom:10px;white-space:pre-wrap}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;border-bottom:1px solid #eee;text-align:left}.muted{font-size:12px;color:#666}.ok{color:#137333}.bad{color:#b3261e}</style></head><body><header><b>บุคลากรและการจับคู่</b> <span id="ver" class="muted"></span></header><div class="tabs"><button class="active" onclick="tab('people',this)">บุคลากร</button><button onclick="tab('alias',this)">จับคู่ชื่อ</button><button onclick="tab('scope',this)">ไม่ต้องประมวลผล</button><button onclick="tab('qa',this)">ตรวจสอบปัญหา</button><button onclick="tab('migration',this)">นำเข้าจากระบบเดิม</button></div><main><div id="msg" class="status">กำลังโหลดบุคลากร...</div>
<section id="people" class="panel active"><div class="card"><b id="modeText">โหมด: เพิ่มบุคลากรใหม่</b><div class="row"><div class="field"><label>EMP ID (ว่าง = สร้างอัตโนมัติ)</label><input id="p_emp"></div><div class="field"><label>ชื่อ-นามสกุล</label><input id="p_name"></div><div class="field"><label>ตำแหน่ง</label><input id="p_pos"></div><div class="field"><label>กลุ่ม/ฝ่าย</label><input id="p_dep"></div></div><div class="row" style="margin-top:8px"><div class="field"><label>หมายเหตุ</label><input id="p_note"></div><label><input type="checkbox" id="p_active" checked> ใช้งาน</label><button class="primary" onclick="savePerson()">บันทึก</button><button onclick="newPerson()">เพิ่มคนใหม่</button></div></div><div class="card"><input id="p_search" placeholder="ค้นหา" oninput="renderPeople()"><table><thead><tr><th>EMP ID</th><th>ชื่อ</th><th>ตำแหน่ง</th><th>กลุ่ม</th><th>สถานะ</th><th></th></tr></thead><tbody id="peopleBody"></tbody></table></div></section>
<section id="alias" class="panel"><div class="card"><button onclick="loadAliases()">ลองโหลดใหม่</button><div class="row"><div class="field"><label>ชื่อจากแหล่งข้อมูล</label><input id="a_source"></div><div class="field"><label>บุคลากร</label><select id="a_emp"></select></div><div class="field"><label>หมายเหตุ</label><input id="a_note"></div><button class="primary" onclick="saveAlias()">เพิ่ม/อัปเดต Alias</button></div></div><div class="card"><div id="aliasStatus" class="muted">ยังไม่ได้โหลด Alias</div><table><tbody id="aliasBody"></tbody></table></div></section>
<section id="scope" class="panel"><div class="card"><div class="row"><div class="field"><label>ประเภท</label><select id="s_type" onchange="scopeTypeChanged()"><option value="EMP_ID">บุคลากร (EMP ID)</option><option value="SOURCE_NAME">ชื่อจากแหล่งข้อมูล</option></select></div><div class="field" id="s_emp_wrap"><label>บุคลากร</label><select id="s_emp"></select></div><div class="field" id="s_name_wrap" style="display:none"><label>ชื่อจากแหล่งข้อมูล</label><input id="s_name"></div><div class="field"><label>เหตุผล</label><input id="s_reason"></div><button class="primary" onclick="saveScope()">เพิ่มรายการ</button></div></div><div class="card"><div id="scopeStatus" class="muted">ยังไม่ได้โหลด Scope</div><table><tbody id="scopeBody"></tbody></table></div></section>
<section id="qa" class="panel"><div class="card"><button class="primary" onclick="loadQa()">ตรวจสอบตอนนี้</button><div id="qaText">ยังไม่ได้ตรวจ</div></div></section>
<section id="migration" class="panel"><div class="card"><label>ลิงก์/Spreadsheet ID ของ PDMS เดิม</label><input id="m_source" style="width:96%"><div><button class="primary" onclick="migrationPreview()">1) Dry Run</button><button id="commitBtn" disabled onclick="migrationCommit()">2) ยืนยันนำเข้า</button></div><div id="migrationResult" style="white-space:pre-wrap;margin-top:8px"></div></div></section></main>
<script>let people=[],aliases=[],scopes=[],editOriginalEmpId='',migrationFp='',loaded={alias:false,scope:false,qa:false};const RPC_TIMEOUT=20000;function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function M(t){msg.textContent=t}function X(e){return e&&e.message?e.message:String(e||'ไม่ทราบข้อผิดพลาด')}function rpc(name,args,ok,fail,timeout){let done=false;const tm=setTimeout(()=>{if(done)return;done=true;const t='ใช้เวลานานเกิน '+Math.round((timeout||RPC_TIMEOUT)/1000)+' วินาที ระบบหยุดรอหน้าต่างนี้แล้ว\nกด “ลองโหลดใหม่” หรือใช้ PDMS → ระบบ → กู้คืนงานค้าง';M(t);fail&&fail({message:t,timeout:true})},timeout||RPC_TIMEOUT);let r=google.script.run.withSuccessHandler(v=>{if(done)return;done=true;clearTimeout(tm);ok&&ok(v)}).withFailureHandler(e=>{if(done)return;done=true;clearTimeout(tm);M('เกิดข้อผิดพลาด: '+X(e));fail&&fail(e)});r[name].apply(r,args||[])}function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='alias'&&!loaded.alias)loadAliases();if(id==='scope'&&!loaded.scope)loadScopes();if(id==='qa'&&!loaded.qa)loadQa()}function fill(){const o=people.map(p=>`<option value="${E(p.empId)}">${E(p.empId+' — '+p.fullName)}</option>`).join('');a_emp.innerHTML=o;s_emp.innerHTML=o}function renderPeople(){const q=(p_search.value||'').toLowerCase();peopleBody.innerHTML=people.filter(p=>(p.empId+' '+p.fullName+' '+p.position+' '+p.department).toLowerCase().includes(q)).map(p=>`<tr><td>${E(p.empId)}</td><td>${E(p.fullName)}</td><td>${E(p.position)}</td><td>${E(p.department)}</td><td>${p.active?'ใช้งาน':'ปิด'}</td><td><button data-e="${E(p.empId)}" onclick="editPerson(this.dataset.e)">แก้ไข</button></td></tr>`).join('')}function newPerson(){editOriginalEmpId='';p_emp.readOnly=false;['p_emp','p_name','p_pos','p_dep','p_note'].forEach(id=>document.getElementById(id).value='');p_active.checked=true;modeText.textContent='โหมด: เพิ่มบุคลากรใหม่'}function editPerson(id){const p=people.find(x=>x.empId===id);if(!p)return;editOriginalEmpId=id;p_emp.value=id;p_emp.readOnly=true;p_name.value=p.fullName;p_pos.value=p.position;p_dep.value=p.department;p_note.value=p.note||'';p_active.checked=!!p.active;modeText.textContent='โหมด: แก้ไข '+id+' (EMP ID เปลี่ยนไม่ได้)'}function reloadPeople(cb){rpc('pdmscPersonnelCenterPeople',[],v=>{people=v||[];fill();renderPeople();cb&&cb()})}function savePerson(){const mode=editOriginalEmpId?'EDIT':'CREATE';M('กำลังบันทึก...');rpc('pdmscSavePersonnel',[{mode,originalEmpId:editOriginalEmpId,empId:p_emp.value,fullName:p_name.value,position:p_pos.value,department:p_dep.value,note:p_note.value,active:p_active.checked}],()=>reloadPeople(()=>{newPerson();M('บันทึกสำเร็จ')}))}function loadAliases(){aliasStatus.textContent='กำลังโหลด Alias...';rpc('pdmscPersonnelCenterAliases',[],v=>{aliases=v||[];loaded.alias=true;aliasBody.innerHTML=aliases.map((a,i)=>`<tr><td>${E(a.sourceName)}</td><td>${E(a.empId)}</td><td>${E(a.canonicalName)}</td><td>${E(a.status)}</td><td><button onclick="toggleAlias(${i})">${a.status==='ACTIVE'?'ปิด':'เปิด'}</button></td></tr>`).join('');aliasStatus.textContent='โหลดแล้ว '+aliases.length+' รายการ';M('พร้อมใช้งาน')},e=>aliasStatus.textContent='โหลด Alias ไม่สำเร็จ: '+X(e))}function saveAlias(){M('กำลังบันทึก Alias...');rpc('pdmscSaveAlias',[{sourceName:a_source.value,empId:a_emp.value,note:a_note.value}],()=>{a_source.value='';a_note.value='';loadAliases()})}function toggleAlias(i){const a=aliases[i];rpc('pdmscSetAliasActive',[a.sourceName,a.empId,a.status!=='ACTIVE'],()=>loadAliases())}function scopeTypeChanged(){const e=s_type.value==='EMP_ID';s_emp_wrap.style.display=e?'flex':'none';s_name_wrap.style.display=e?'none':'flex'}function loadScopes(){scopeStatus.textContent='กำลังโหลด Scope...';rpc('pdmscPersonnelCenterScopes',[],v=>{scopes=v||[];loaded.scope=true;scopeBody.innerHTML=scopes.map((s,i)=>`<tr><td>${E(s.scopeType)}</td><td>${E(s.scopeType==='EMP_ID'?(s.empId+' — '+s.displayName):s.displayName)}</td><td>${E(s.reason)}</td><td>${s.active?'ใช้งาน':'ปิด'}</td><td><button onclick="toggleScope(${i})">${s.active?'ปิด':'เปิด'}</button></td></tr>`).join('');scopeStatus.textContent='โหลดแล้ว '+scopes.length+' รายการ';M('พร้อมใช้งาน')},e=>scopeStatus.textContent='โหลด Scope ไม่สำเร็จ: '+X(e))}function saveScope(){rpc('pdmscSaveScopeExclusion',[{scopeType:s_type.value,empId:s_emp.value,sourceName:s_name.value,reason:s_reason.value}],()=>loadScopes())}function toggleScope(i){const s=scopes[i];rpc('pdmscSetScopeExclusionActive',[s.row,!s.active],()=>loadScopes())}function loadQa(){qaText.textContent='กำลังตรวจ...';rpc('pdmscPersonnelCenterQa',[],q=>{loaded.qa=true;qaText.innerHTML=`<b class="${q.ok?'ok':'bad'}">${q.ok?'PASS':'พบปัญหา '+q.issues.length+' รายการ'}</b><br>บุคลากร ${q.counts.personnel} | Alias ${q.counts.aliases} | ไม่ประมวลผล ${q.counts.scopeExclusions}<br>`+(q.issues||[]).slice(0,20).map(x=>'• '+E(x.code)+' — '+E(x.ref)+'<br>').join('');M(q.ok?'QA ผ่าน':'QA พบรายการต้องตรวจ')},e=>qaText.textContent='QA ไม่สำเร็จ: '+X(e))}function migrationPreview(){migrationFp='';commitBtn.disabled=true;migrationResult.textContent='กำลังตรวจ...';rpc('pdmscPreviewOldPersonnelMigration',[m_source.value],p=>{migrationFp=p.fingerprint;commitBtn.disabled=false;migrationResult.textContent=`ต้นทาง: ${p.sourceName}\nบุคลากรพร้อมเพิ่ม: ${p.counts.readyPersonnel}\nAlias พร้อมเพิ่ม: ${p.counts.readyAliases}\nไม่ต้องประมวลผล: ${p.counts.sourceExclusions}\nต้องตรวจ: ${p.counts.review}`;M('Dry Run เสร็จแล้ว — ยังไม่ได้เขียนข้อมูล')},e=>migrationResult.textContent='Dry Run ไม่สำเร็จ: '+X(e),30000)}function migrationCommit(){if(!migrationFp||!confirm('ยืนยันนำเข้าหรือไม่?'))return;commitBtn.disabled=true;rpc('pdmscCommitOldPersonnelMigration',[m_source.value,migrationFp],()=>{migrationResult.textContent+='\nCOMMIT สำเร็จ';reloadPeople(()=>M('Migration Commit สำเร็จ'))},e=>{commitBtn.disabled=false;migrationResult.textContent+='\nCOMMIT ไม่สำเร็จ: '+X(e)},45000)}rpc('pdmscPersonnelCenterBootstrap',[],s=>{people=s.personnel||[];ver.textContent=s.version;fill();renderPeople();newPerson();M('พร้อมใช้งาน')},e=>M('เปิดแบบกู้คืน: โหลดบุคลากรไม่สำเร็จ — '+X(e)));</script></body></html>
